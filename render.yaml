# ------------------------------------------------------------------
# Brobond AI Commerce OS — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Provisions a managed PostgreSQL database and a Dockerized web service.
# Merges into `main` trigger an automatic deploy (autoDeploy: true) and
# run `prisma migrate deploy` before the service starts.
# ------------------------------------------------------------------

databases:
  - name: brobond-db
    databaseName: brobond
    user: brobond
    plan: free

services:
  - type: web
    name: brobond-ai-commerce
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    # Run pending migrations before the new instance receives traffic.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brobond-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      # PR007 — AI Personalization Engine. Never committed; set manually in
      # the Render dashboard. Read only server-side (see
      # modules/ai/openai/client.ts) — never exposed to the client bundle.
      - key: OPENAI_API_KEY
        sync: false
