# ------------------------------------------------------------------
# Brobond AI Commerce OS — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# PostgreSQL is provisioned by Render. Every release installs from the lock
# file, generates Prisma, builds Next.js and deploys migrations before startup.
# ------------------------------------------------------------------

databases:
  - name: brobond-db
    databaseName: brobond
    user: brobond
    plan: free

services:
  - type: web
    name: brobond-ai-commerce
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    # `preDeployCommand` is a paid-plan feature and is silently ignored on some
    # plans — which is how production ended up serving a database that had
    # never been migrated ("relation _prisma_migrations does not exist"). It is
    # kept, because running migrations once per release is the right place for
    # them, but the start command now applies them too. `migrate deploy` is
    # idempotent, so the second invocation is a no-op on an up-to-date
    # database. `npm run prisma:deploy` wraps `prisma migrate deploy` with the
    # safe one-time repair for the known pre-PR36 outreach P3009 state, and
    # `npm start`'s prestart gate still refuses to boot if the schema is somehow
    # still incomplete.
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/health/database
    envVars:
      # Do not set NODE_ENV here: Render also applies envVars during `npm ci`,
      # and npm would omit the Prisma/TypeScript build toolchain. `next start`
      # sets NODE_ENV=production for the runtime process.
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brobond-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      # Keep each Render instance within the managed PostgreSQL connection cap.
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      # Optional observability integrations. Leave SENTRY_DSN and the OTLP
      # endpoint unset to keep reporting/export disabled.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_NAME
        value: brobond-ai-commerce
      - key: OTEL_SERVICE_VERSION
        sync: false
      # PR007 — AI Personalization Engine. Never committed; set manually in
      # the Render dashboard. Read only server-side.
      - key: OPENAI_API_KEY
        sync: false
      # Required for transactional workspace invitations. Raw invitation URLs
      # contain single-use bearer tokens and are never logged.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # The web process may run without Redis, but does not start a worker.
      - key: REDIS_URL
        sync: false
      - key: AI_AUTONOMY_ENABLED
        value: "false"
      - key: AI_ORG_RUN_BUDGET_CENTS
        value: "100"
      - key: AI_ORG_PERIOD_BUDGET_CENTS
        value: "1000"
      - key: AI_BUDGET_PERIOD_HOURS
        value: "24"

  - type: worker
    name: brobond-async-worker
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: brobond-db
          property: connectionString
      # Set this in Render. Startup fails loudly if it is absent or invalid.
      - key: REDIS_URL
        sync: false
      - key: REDIS_PREFIX
        value: brobond
      - key: QUEUE_CONCURRENCY
        value: "5"
      - key: SENTRY_DSN
        sync: false
