# ------------------------------------------------------------------
# Brobond AI Commerce OS — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# PostgreSQL is provisioned by Render. Every release installs from the lock
# file, generates Prisma, builds Next.js and deploys migrations before startup.
# ------------------------------------------------------------------

databases:
  - name: brobond-db
    databaseName: brobond
    user: brobond
    plan: free

services:
  - type: web
    name: brobond-ai-commerce
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    # `preDeployCommand` is a paid-plan feature and is silently ignored on some
    # plans — which is how production ended up serving a database that had
    # never been migrated ("relation _prisma_migrations does not exist"). It is
    # kept, because running migrations once per release is the right place for
    # them, but the start command now applies them too. `migrate deploy` is
    # idempotent, so the second invocation is a no-op on an up-to-date
    # database, and `npm start`'s prestart gate still refuses to boot if the
    # schema is somehow still incomplete.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health/database
    envVars:
      # Do not set NODE_ENV here: Render also applies envVars during `npm ci`,
      # and npm would omit the Prisma/TypeScript build toolchain. `next start`
      # sets NODE_ENV=production for the runtime process.
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brobond-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      # Keep each Render instance within the managed PostgreSQL connection cap.
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      # PR007 — AI Personalization Engine. Never committed; set manually in
      # the Render dashboard. Read only server-side.
      - key: OPENAI_API_KEY
        sync: false
