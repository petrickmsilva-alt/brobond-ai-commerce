name: Deploy (Render)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Add it in repo Settings → Secrets → Actions to enable auto-deploy."
            echo "Render also auto-deploys on merge when the Blueprint has autoDeploy: true."
            exit 0
          fi
          echo "Triggering Render deploy…"
          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Deploy triggered."
